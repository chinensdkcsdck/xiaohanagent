server.port=8080

# model logging (disable in production)
langchain4j.open-ai.chat-model.log-requests=${OPENAI_CHAT_LOG_REQUESTS:false}
langchain4j.open-ai.chat-model.log-responses=${OPENAI_CHAT_LOG_RESPONSES:false}

# DashScope / OpenAI-compatible model configuration
langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.chat-model.model-name=${DASHSCOPE_CHAT_MODEL:qwen-max}

langchain4j.open-ai.chat-model.base-url=${OPENAI_COMPAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
langchain4j.open-ai.chat-model.api-key=${OPENAI_COMPAT_API_KEY:}
langchain4j.open-ai.chat-model.model-name=${OPENAI_COMPAT_CHAT_MODEL:deepseek-v3}
langchain4j.open-ai.chat-model.temperature=${OPENAI_COMPAT_TEMPERATURE:0.7}

# MongoDB chat memory
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}

logging.level.root=info
logging.pattern.level=%5p [traceId:%X{traceId}]

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/xiaohan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Concurrency baseline (Tomcat + Hikari)
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:300}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1000}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:60}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:20}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT_MS:1000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECT_MS:2000}
spring.mvc.async.request-timeout=${SPRING_MVC_ASYNC_TIMEOUT_MS:30000}

# Distributed lock
app.lock.type=${APP_LOCK_TYPE:mysql}
app.lock.wait-ms=${APP_LOCK_WAIT_MS:200}
app.lock.lease-ms=${APP_LOCK_LEASE_MS:5000}

# Redis (for distributed lock when app.lock.type=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}

# RabbitMQ (for async booking events)
app.mq.enabled=${APP_MQ_ENABLED:false}
app.mq.booking-exchange=${APP_MQ_BOOKING_EXCHANGE:booking.exchange}
app.mq.booking-queue=${APP_MQ_BOOKING_QUEUE:booking.notify.queue}
app.mq.booking-routing-key=${APP_MQ_BOOKING_ROUTING_KEY:booking.created}
app.mq.booking-dlx-exchange=${APP_MQ_BOOKING_DLX_EXCHANGE:booking.dlx.exchange}
app.mq.booking-dlx-queue=${APP_MQ_BOOKING_DLX_QUEUE:booking.dlx.queue}
app.mq.booking-dlx-routing-key=${APP_MQ_BOOKING_DLX_ROUTING_KEY:booking.dlx}
app.mq.listener-max-attempts=${APP_MQ_LISTENER_MAX_ATTEMPTS:3}
app.mq.listener-initial-interval-ms=${APP_MQ_LISTENER_INITIAL_INTERVAL_MS:500}
app.mq.listener-multiplier=${APP_MQ_LISTENER_MULTIPLIER:2.0}
app.mq.listener-max-interval-ms=${APP_MQ_LISTENER_MAX_INTERVAL_MS:5000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.encoding=UTF-8
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# Embedding model
langchain4j.community.dashscope.embedding-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.embedding-model.model-name=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
langchain4j.dashscope.embedding-model.dimension=${DASHSCOPE_EMBEDDING_DIMENSION:1024}

# RAG observed retriever switch (A/B benchmarking)
app.rag.observed.enabled=${APP_RAG_OBSERVED_ENABLED:true}
app.rag.top-k=${APP_RAG_TOP_K:3}

# Optional Chroma vector persistence. Hybrid retrieval always keeps BM25 locally
# and uses the configured EmbeddingStore for vector recall.
app.vector.chroma.enabled=${CHROMA_ENABLED:false}
app.vector.chroma.url=${CHROMA_URL:http://localhost:8000}
app.vector.chroma.collection=${CHROMA_COLLECTION:xiaohan-knowledge}

# Streaming chat model
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.streaming-chat-model.model-name=${DASHSCOPE_STREAMING_MODEL:qwen-max}

# Pinecone vector store
app.vector.pinecone.api-key=${PINECONE_API_KEY:}
app.vector.pinecone.index=${PINECONE_INDEX:xiaohan-index}
app.vector.pinecone.namespace=${PINECONE_NAMESPACE:xiaohan-namespace}
app.vector.pinecone.cloud=${PINECONE_CLOUD:AWS}
app.vector.pinecone.region=${PINECONE_REGION:us-east-1}

# Appointment capacity
app.appointment.default-capacity=${APPOINTMENT_DEFAULT_CAPACITY:20}
app.appointment.department-capacity.neike=${APPOINTMENT_CAPACITY_NEIKE:30}
app.appointment.department-capacity.erke=${APPOINTMENT_CAPACITY_ERKE:20}

# Exam capacity
app.exam.default-capacity=${EXAM_DEFAULT_CAPACITY:20}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
