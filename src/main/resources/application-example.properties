# Copy to application-local.properties and fill values, or set environment variables.

DASHSCOPE_API_KEY=your_dashscope_api_key
OPENAI_COMPAT_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
OPENAI_COMPAT_API_KEY=your_openai_compatible_key
OPENAI_COMPAT_CHAT_MODEL=deepseek-v3
OPENAI_CHAT_LOG_REQUESTS=false
OPENAI_CHAT_LOG_RESPONSES=false

MONGODB_URI=mongodb://localhost:27017/chat_memory_db

MYSQL_URL=jdbc:mysql://localhost:3306/xiaohan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
MYSQL_USERNAME=root
MYSQL_PASSWORD=your_mysql_password

PINECONE_API_KEY=your_pinecone_api_key
PINECONE_INDEX=xiaohan-index
PINECONE_NAMESPACE=xiaohan-namespace
PINECONE_CLOUD=AWS
PINECONE_REGION=us-east-1

APPOINTMENT_DEFAULT_CAPACITY=20
APPOINTMENT_CAPACITY_NEIKE=30
APPOINTMENT_CAPACITY_ERKE=20
EXAM_DEFAULT_CAPACITY=20

# Concurrency baseline
TOMCAT_THREADS_MAX=300
TOMCAT_ACCEPT_COUNT=1000
TOMCAT_MAX_CONNECTIONS=8192
HIKARI_MAX_POOL_SIZE=60
HIKARI_MIN_IDLE=20
HIKARI_CONN_TIMEOUT_MS=1000
HIKARI_VALIDATION_TIMEOUT_MS=1000
HIKARI_MAX_LIFETIME_MS=1800000
HIKARI_IDLE_TIMEOUT_MS=600000
HIKARI_LEAK_DETECT_MS=2000
SPRING_MVC_ASYNC_TIMEOUT_MS=30000

# Distributed lock
APP_LOCK_TYPE=mysql
APP_LOCK_WAIT_MS=200
APP_LOCK_LEASE_MS=5000

# Redis (used when APP_LOCK_TYPE=redis)
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=
REDIS_DB=0

# RabbitMQ
APP_MQ_ENABLED=false
APP_MQ_BOOKING_EXCHANGE=booking.exchange
APP_MQ_BOOKING_QUEUE=booking.notify.queue
APP_MQ_BOOKING_ROUTING_KEY=booking.created
APP_MQ_BOOKING_DLX_EXCHANGE=booking.dlx.exchange
APP_MQ_BOOKING_DLX_QUEUE=booking.dlx.queue
APP_MQ_BOOKING_DLX_ROUTING_KEY=booking.dlx
APP_MQ_LISTENER_MAX_ATTEMPTS=3
APP_MQ_LISTENER_INITIAL_INTERVAL_MS=500
APP_MQ_LISTENER_MULTIPLIER=2.0
APP_MQ_LISTENER_MAX_INTERVAL_MS=5000
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_USERNAME=guest
RABBITMQ_PASSWORD=guest
